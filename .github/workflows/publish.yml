name: Publish Go Package

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.x'
          
      - name: Install tools
        run: |
          go install golang.org/x/lint/golint@latest
          
      - name: Run tests and lint
        run: |
          golint ./...
          go fmt ./...
          go build ./...
          
      - name: Tag and Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep "const Version =" version.go | cut -d '"' -f 2)
          git tag v$VERSION
          git push origin v$VERSION
          
      # Go packages are automatically available via pkg.go.dev once tagged
